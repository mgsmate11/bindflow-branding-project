<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Az oldal-szintű cím, leírás, canonical és OG/Twitter cím+leírás
         oldalanként a React Seo komponensből (react-helmet-async) kerül a
         prerendelt HTML-be — lásd src/components/Seo.tsx. Itt csak a minden
         oldalon közös, nem változó meta marad (különben duplikálódna). -->
    <meta name="keywords" content="AI megoldások, mesterséges intelligencia, automatizáció, chatbot, AI tanácsadás, digitális transzformáció, Magyarország, n8n, Zapier, vállalati AI" />
    <meta name="author" content="Bindflow" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bindflow" />
    <meta property="og:image" content="https://bindflow.hu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bindflow" />
    <meta property="og:locale" content="hu_HU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bindflow.hu/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bindflow",
      "url": "https://bindflow.hu",
      "logo": "https://bindflow.hu/bindflow-logo.png",
      "description": "AI tanácsadás, automatizáció és chatbot fejlesztés magyar vállalkozásoknak.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "HU"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+36204524280",
          "contactType": "sales",
          "availableLanguage": ["Hungarian", "English"]
        }
      ],
      "sameAs": []
    }
    </script>

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Bindflow",
      "url": "https://bindflow.hu",
      "description": "AI megoldások, automatizáció és digitális transzformáció magyar vállalkozásoknak.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "HU"
      },
      "openingHours": "Mo-Fr 09:00-18:00",
      "priceRange": "$$",
      "serviceArea": {
        "@type": "Country",
        "name": "Hungary"
      }
    }
    </script>

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
